name: Facebook Reels Automation

concurrency:
  group: facebook-reels-automation
  cancel-in-progress: false

on:
  # Conservative 1-Reel/Day automatic public publishing at 08:30 PM IST (15:00 UTC).
  # Scheduled runs activate automatically once ZERNIO_API_KEY secret is configured
  # (or FB_DELIVERY_MODE=export is set inside ENV_FILE).
  schedule:
    - cron: '0 15 * * *'

  workflow_dispatch:
    inputs:
      count:
        description: 'Number of Reels to generate/publish'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
          - '7'
      delivery_mode:
        description: 'auto = Zernio automatic upload if configured else Export ZIP; zernio = Auto Public Reels; export = ZIP + Telegram'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'zernio'
          - 'export'
          - 'publish_api'

jobs:
  publish-reels:
    name: Generate & Publish Facebook Reels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg & Indian Devanagari Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-deva fonts-noto-core fonts-indic fonts-freefont-ttf

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Environment & Check Auto-Publish Readiness
        id: env_setup
        env:
          ENV_SECRET: ${{ secrets.ENV_FILE }}
          FB_TOKEN_SECRET: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_SECRET: ${{ secrets.FB_PAGE_ID }}
          ZERNIO_KEY_SECRET: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACC_SECRET: ${{ secrets.ZERNIO_FACEBOOK_ACCOUNT_ID }}
          TG_TOKEN_SECRET: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_SECRET: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.delivery_mode || 'auto' }}
        run: |
          mkdir -p facebook/data facebook/output facebook/output/export_ready facebook/temp

          if [ -n "$ENV_SECRET" ]; then
            printf '%s\n' "$ENV_SECRET" > .env
          fi
          if [ -n "$FB_TOKEN_SECRET" ]; then
            echo "FB_PAGE_ACCESS_TOKEN=$FB_TOKEN_SECRET" >> .env
          fi
          if [ -n "$FB_PAGE_SECRET" ]; then
            echo "FB_PAGE_ID=$FB_PAGE_SECRET" >> .env
          fi
          if [ -n "$ZERNIO_KEY_SECRET" ]; then
            echo "ZERNIO_API_KEY=$ZERNIO_KEY_SECRET" >> .env
          fi
          if [ -n "$ZERNIO_ACC_SECRET" ]; then
            echo "ZERNIO_FACEBOOK_ACCOUNT_ID=$ZERNIO_ACC_SECRET" >> .env
          fi
          if [ -n "$TG_TOKEN_SECRET" ]; then
            echo "TELEGRAM_BOT_TOKEN=$TG_TOKEN_SECRET" >> .env
          fi
          if [ -n "$TG_CHAT_SECRET" ]; then
            echo "TELEGRAM_CHAT_ID=$TG_CHAT_SECRET" >> .env
          fi
          if ! grep -q "FB_PAGE_ID=" .env 2>/dev/null; then
            echo "FB_PAGE_ID=1289712677569663" >> .env
          fi

          HAS_ZERNIO=false
          if grep -qE '^ZERNIO_API_KEY=.+' .env 2>/dev/null; then
            HAS_ZERNIO=true
          fi

          SHOULD_RUN=true
          if [ "$EVENT_NAME" = "schedule" ] && [ "$HAS_ZERNIO" = "false" ] && ! grep -qE '^FB_DELIVERY_MODE=export' .env 2>/dev/null; then
            echo "⏳ Scheduled run paused: ZERNIO_API_KEY secret is not configured yet."
            echo "👉 Add free ZERNIO_API_KEY (https://zernio.com) in Repo Settings -> Secrets -> Actions to enable 100% automatic public Reels at 08:30 PM IST."
            SHOULD_RUN=false
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "has_zernio=$HAS_ZERNIO" >> "$GITHUB_OUTPUT"
          echo "✅ Environment ready (should_run=$SHOULD_RUN, has_zernio=$HAS_ZERNIO)"

      - name: Generate & Deliver Facebook Reel(s)
        if: steps.env_setup.outputs.should_run == 'true'
        env:
          CI: true
          FB_DELIVERY_MODE: ${{ github.event.inputs.delivery_mode || 'auto' }}
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          MODE="${{ github.event.inputs.delivery_mode || 'auto' }}"
          echo "🚀 Starting Facebook Reels Agent (Mode: $MODE, Count: $COUNT)..."
          node facebook/fb-runner.js --count "$COUNT"

      - name: Upload Ready-to-Schedule Reels Artifact (Export Fallback)
        if: steps.env_setup.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: exam-iq-bharat-reels-${{ github.run_number }}
          path: facebook/output/export_ready/
          if-no-files-found: ignore
          retention-days: 30

      - name: Run Facebook Analytics & Self-Optimization
        if: steps.env_setup.outputs.should_run == 'true' && github.event.inputs.delivery_mode == 'publish_api'
        env:
          CI: true
        run: |
          echo "📊 Running Facebook Performance Analysis & Adaptive Optimizer..."
          node facebook/analytics-agent.js || true

      - name: Commit Updated Upload History & Learned Preferences
        if: steps.env_setup.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add facebook/data/history.json facebook/data/learned_preferences.json facebook/data/reports/ || true
          if git diff --staged --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "chore(facebook): update reels delivery history [skip ci]"
            git push origin HEAD || true
          fi
