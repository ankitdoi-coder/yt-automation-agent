name: Facebook Reels Automation

concurrency:
  group: facebook-reels-automation
  cancel-in-progress: false

on:
  # Automated API schedule paused while Meta App is in Development Mode.
  # Trigger on-demand via Actions -> Run workflow (workflow_dispatch):
  # Choose delivery_mode='export' (default) to generate a Meta Business Suite ZIP + Telegram batch.

  workflow_dispatch:
    inputs:
      count:
        description: 'Number of Reels to generate (e.g. 7 for a full weekly Meta Business Suite batch)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
          - '7'
      delivery_mode:
        description: 'Delivery mode (export = Ready-to-Schedule ZIP Artifact + Telegram; publish_api = Meta Graph API)'
        required: true
        default: 'export'
        type: choice
        options:
          - 'export'
          - 'publish_api'

jobs:
  publish-reels:
    name: Generate & Deliver Facebook Reels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg & Indian Devanagari Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-deva fonts-noto-core fonts-indic fonts-freefont-ttf

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Environment
        env:
          ENV_SECRET: ${{ secrets.ENV_FILE }}
          FB_TOKEN_SECRET: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_SECRET: ${{ secrets.FB_PAGE_ID }}
          TG_TOKEN_SECRET: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_SECRET: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p facebook/data facebook/output facebook/output/export_ready facebook/temp

          # If ENV_FILE secret exists, write it
          if [ -n "$ENV_SECRET" ]; then
            printf '%s\n' "$ENV_SECRET" > .env
          fi

          # Allow explicit secret overrides if configured
          if [ -n "$FB_TOKEN_SECRET" ]; then
            echo "FB_PAGE_ACCESS_TOKEN=$FB_TOKEN_SECRET" >> .env
          fi
          if [ -n "$FB_PAGE_SECRET" ]; then
            echo "FB_PAGE_ID=$FB_PAGE_SECRET" >> .env
          fi
          if [ -n "$TG_TOKEN_SECRET" ]; then
            echo "TELEGRAM_BOT_TOKEN=$TG_TOKEN_SECRET" >> .env
          fi
          if [ -n "$TG_CHAT_SECRET" ]; then
            echo "TELEGRAM_CHAT_ID=$TG_CHAT_SECRET" >> .env
          fi

          # Ensure page ID fallback
          if ! grep -q "FB_PAGE_ID=" .env 2>/dev/null; then
            echo "FB_PAGE_ID=1289712677569663" >> .env
          fi

          echo "✅ Environment configured for Facebook Reels workflow"

      - name: Generate & Deliver Facebook Reel(s)
        env:
          CI: true
          FB_DELIVERY_MODE: ${{ github.event.inputs.delivery_mode || 'export' }}
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          MODE="${{ github.event.inputs.delivery_mode || 'export' }}"
          echo "🚀 Starting Facebook Reels Agent (Mode: $MODE, Count: $COUNT)..."
          node facebook/fb-runner.js --count "$COUNT"

      - name: Upload Ready-to-Schedule Reels Artifact
        if: always() && (github.event.inputs.delivery_mode || 'export') == 'export'
        uses: actions/upload-artifact@v4
        with:
          name: exam-iq-bharat-reels-${{ github.run_number }}
          path: facebook/output/export_ready/
          if-no-files-found: warn
          retention-days: 30

      - name: Run Facebook Analytics & Self-Optimization
        if: (github.event.inputs.delivery_mode || 'export') == 'publish_api'
        env:
          CI: true
        run: |
          echo "📊 Running Facebook Performance Analysis & Adaptive Optimizer..."
          node facebook/analytics-agent.js || true

      - name: Commit Updated Upload History & Learned Preferences
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add facebook/data/history.json facebook/data/learned_preferences.json facebook/data/reports/ || true
          if git diff --staged --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "chore(facebook): update reels delivery history [skip ci]"
            git push origin HEAD || true
          fi
