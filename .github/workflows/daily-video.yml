name: Daily YouTube Video Automation

on:
  schedule:
    # Runs daily at 00:20 UTC = 05:50 AM IST (Indian Standard Time)
    # Minute 20 avoids GitHub Actions :00 and :30 peak load queue delays
    # Generates today's 4 videos (2 Long + 2 Shorts) and schedules them for peak viewing hours
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      target_slot:
        description: 'Which slot to generate'
        required: true
        default: 'all (2 Long + 2 Shorts)'
        type: choice
        options:
          - all (2 Long + 2 Shorts)
          - slot1 (11:30 AM IST Long Quiz)
          - slot2 (01:30 PM IST Shorts)
          - slot3 (04:30 PM IST Long Quiz)
          - slot4 (08:00 PM IST Shorts)
      privacy_status:
        description: 'Target privacy status (public = auto-publishes to everyone)'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - private
          - unlisted
      topic:
        description: 'Optional custom topic (leave blank for fresh AI trend research)'
        required: false
        default: ''

jobs:
  generate-and-publish:
    name: Generate & Publish Daily Videos
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System FFmpeg, Indian Devanagari Fonts & Edge TTS
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva fonts-indic fonts-freefont-ttf python3-pip
          pip install --break-system-packages edge-tts || sudo pip install edge-tts || python3 -m pip install edge-tts || pip install edge-tts

      - name: Install Node Dependencies
        run: npm ci

      - name: Restore Credentials & Secrets
        env:
          ENV_SECRET: ${{ secrets.ENV_FILE }}
          CREDS_SECRET: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TOKENS_SECRET: ${{ secrets.YOUTUBE_TOKENS_JSON }}
        run: |
          mkdir -p config data/thumbnails data/audio data/videos logs

          if [ -z "$ENV_SECRET" ]; then
            echo "::error::GitHub Secret 'ENV_FILE' is empty or not set in Settings > Secrets > Actions"
            exit 1
          fi

          if [ -z "$CREDS_SECRET" ]; then
            echo "::error::GitHub Secret 'GOOGLE_CREDENTIALS_JSON' is empty or not set in Settings > Secrets > Actions"
            exit 1
          fi

          if [ -z "$TOKENS_SECRET" ]; then
            echo "::error::GitHub Secret 'YOUTUBE_TOKENS_JSON' is empty or not set in Settings > Secrets > Actions"
            exit 1
          fi

          printf '%s\n' "$ENV_SECRET" > .env
          printf '%s\n' "$CREDS_SECRET" > config/credentials.json
          printf '%s\n' "$TOKENS_SECRET" > config/tokens.json

          echo "✅ Secrets successfully restored (.env, credentials.json, tokens.json)"

      - name: Run Video Generation & Publishing Pipeline
        env:
          TARGET_SLOT: ${{ github.event.inputs.target_slot || 'all' }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
          DEFAULT_PRIVACY_STATUS: ${{ github.event.inputs.privacy_status || 'public' }}
          CI: true
        run: npm run daily:job

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-failure-logs
          path: |
            logs/
            data/*.sqlite
          retention-days: 7
