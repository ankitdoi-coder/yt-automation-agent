name: Daily YouTube Video Automation

concurrency:
  group: daily-video-automation
  cancel-in-progress: false

on:
  schedule:
    # Runs daily at 23:00 UTC = 04:30 AM IST (Indian Standard Time)
    # Starts at 04:30 AM everyday to generate, render, and schedule all 4 daily slots (2 Long + 2 Shorts)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      target_slot:
        description: 'Which slot to generate'
        required: true
        default: 'all (2 Long + 2 Shorts)'
        type: choice
        options:
          - all (2 Long + 2 Shorts)
          - slot1 (09:30 AM IST Shorts - Morning Revision)
          - slot2 (02:00 PM IST Long - Afternoon Study Masterclass)
          - slot3 (07:00 PM IST Long - Evening Prime Exam Class)
          - slot4 (09:30 PM IST Shorts - Bedtime Rapid Scroll)
      privacy_status:
        description: 'Target privacy status (public = auto-publishes to everyone)'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - private
          - unlisted
      force_run:
        description: 'Force run (generate even if already uploaded in last 18h)'
        required: true
        default: false
        type: boolean
      topic:
        description: 'Optional custom topic (leave blank for fresh AI trend research)'
        required: false
        default: ''

jobs:
  generate-and-publish:
    name: Generate & Publish Daily Videos (2 Long + 2 Shorts)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System FFmpeg, Indian Devanagari Fonts & Audio TTS Engines
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva fonts-indic fonts-freefont-ttf python3-pip python3-setuptools
          python3 -m pip install --break-system-packages edge-tts gTTS || pip3 install edge-tts gTTS || sudo pip install edge-tts gTTS || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH


      - name: Install Node Dependencies
        run: npm ci

      - name: Restore Credentials & Secrets
        env:
          ENV_SECRET: ${{ secrets.ENV_FILE }}
          CREDS_SECRET: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TOKENS_SECRET: ${{ secrets.YOUTUBE_TOKENS_JSON }}
        run: |
          mkdir -p config data/thumbnails data/audio data/videos logs

          if [ -z "$ENV_SECRET" ]; then
            echo "::error::GitHub Secret 'ENV_FILE' is empty or not set in Settings > Secrets > Actions"
            exit 1
          fi

          if [ -z "$CREDS_SECRET" ]; then
            echo "::error::GitHub Secret 'GOOGLE_CREDENTIALS_JSON' is empty or not set in Settings > Secrets > Actions"
            exit 1
          fi

          if [ -z "$TOKENS_SECRET" ]; then
            echo "::error::GitHub Secret 'YOUTUBE_TOKENS_JSON' is empty or not set in Settings > Secrets > Actions"
            exit 1
          fi

          printf '%s\n' "$ENV_SECRET" > .env
          printf '%s\n' "$CREDS_SECRET" > config/credentials.json
          printf '%s\n' "$TOKENS_SECRET" > config/tokens.json

          echo "✅ Secrets successfully restored (.env, credentials.json, tokens.json)"

      - name: Run Video Generation & Publishing Pipeline
        env:
          TARGET_SLOT: ${{ github.event.inputs.target_slot || 'all' }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
          DEFAULT_PRIVACY_STATUS: ${{ github.event.inputs.privacy_status || 'public' }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
          CI: true
        run: npm run daily:job

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-failure-logs
          path: |
            logs/
            data/*.sqlite
          retention-days: 7
